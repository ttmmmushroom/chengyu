plugins {
    id 'com.android.application'
}

android {
    namespace 'com.goodwords.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.goodwords.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // 签名：仅当仓库根目录存在 keystore.properties 时才生效（CI 发布签名 release 时写入）
    signingConfigs {
        release {
            def keyPropsFile = rootProject.file("keystore.properties")
            if (keyPropsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(keyPropsFile))
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
}
