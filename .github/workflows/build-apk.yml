name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Copy web assets into APK
        run: |
          mkdir -p android/app/src/main/assets
          cp app/index.html app/pinyin-pro.js app/idiom.json app/manifest.webmanifest app/sw.js app/icon-192.png app/icon-512.png android/app/src/main/assets/

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: goodwords-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && env.HAS_KEYSTORE == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Copy web assets into APK
        run: |
          mkdir -p android/app/src/main/assets
          cp app/index.html app/pinyin-pro.js app/idiom.json app/manifest.webmanifest app/sw.js app/icon-192.png app/icon-512.png android/app/src/main/assets/

      - name: Decode keystore & write keystore.properties
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/release-key.jks
          cat > android/keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: goodwords-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
