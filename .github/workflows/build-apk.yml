name: Build APK

# 一键出包：推送到 main 或手动触发后，自动构建可安装的 APK 并作为 Artifact 提供下载。
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 调试版 APK：可直接侧载安装到手机，无需签名密钥。
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Copy web assets into APK
        run: |
          mkdir -p android/app/src/main/assets
          cp app/index.html app/pinyin-pro.js app/idiom.json app/manifest.webmanifest app/sw.js app/icon-192.png app/icon-512.png android/app/src/main/assets/

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: goodwords-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
